name: CI alert

# One rolling issue per branch ("CI is failing on develop"), opened when CI fails on main or
# develop (a push, or the weekly run catching a plugin's new release breaking its entry) and
# closed when CI passes there again, so a red branch isn't left unnoticed for days.
# GitHub runs workflow_run workflows only from the default branch, so this starts working once
# it's on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

permissions:
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      RESULT: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - run: |
          title="CI is failing on $BRANCH"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$RESULT" = failure ]; then
            body="CI failed on \`$BRANCH\` (${EVENT}, ${SHA:0:7}): $RUN_URL

          The log says which entry or check failed. A plugin's new release breaking its entry (a renamed or second ZIP, a changed plugin.json name) is fixed in a PR to develop; this issue closes by itself when CI passes again."
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed --comment "CI passes on \`$BRANCH\` again: $RUN_URL"
          fi
